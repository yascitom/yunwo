<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云窝 · 私有网盘</title>
<meta name="description" content="云窝 —— 基于阿里云 OSS 私有桶 + Cloudflare 免流分发的私有网盘">
<meta name="theme-color" content="#0e0f11" id="themeColorMeta">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<script>
(function(){
  try{
    var t=localStorage.getItem('yunwo_theme');
    if(t!=='light'&&t!=='dark'){ var h=new Date().getHours(); t=(h>=7&&h<19)?'light':'dark'; }
    document.documentElement.dataset.theme=t;
    var m=document.getElementById('themeColorMeta');
    if(m) m.content=t==='light'?'#f5f6f8':'#0e0f11';
  }catch(e){}
})();
</script>
</head>
<body>

<div id="lockScreen">
  <button class="iconbtn themebtn theme-fab" id="themeBtnLock" type="button" title="切换主题" aria-label="切换主题">
    <svg class="ico-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v1.5M12 19.5V21M4.2 4.2l1.1 1.1M18.7 18.7l1.1 1.1M3 12h1.5M19.5 12H21M4.2 19.8l1.1-1.1M18.7 5.3l1.1-1.1"/></svg>
    <svg class="ico-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A7.5 7.5 0 1 1 9.5 4 6 6 0 0 0 20 14.5z"/></svg>
  </button>
  <div class="lockbox" id="lockbox">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M7 17h10a3.5 3.5 0 0 0 .4-7 5 5 0 0 0-9.6-1.2A3.5 3.5 0 0 0 7 17z"/></svg>
    </div>
    <h2>云窝</h2>
    <p>私有网盘 · 登录有效 7 天</p>
    <input type="password" id="lockInput" placeholder="访问密码" autocomplete="current-password">
    <button id="lockBtn" type="button">进入</button>
    <div class="lockerr" id="lockErr"></div>
  </div>
  <a class="gh-link" href="https://github.com/yascitom/yunwo" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
    GitHub
  </a>
</div>

<div id="toasts"></div>

<div id="lightbox">
  <div class="lb-box">
    <div class="lb-stage">
      <div id="lbMedia"></div>
      <button class="lb-nav prev" id="lbPrev" type="button" aria-label="上一个">‹</button>
      <button class="lb-nav next" id="lbNext" type="button" aria-label="下一个">›</button>
    </div>
    <div class="lb-meta" id="lbMeta"></div>
    <div class="rename-row" id="lbRenameRow" style="display:none">
      <input type="text" id="lbRenameInput" spellcheck="false" maxlength="200" placeholder="新文件名（含扩展名）">
      <button class="mini" id="lbRenameOk" type="button">确定</button>
      <button class="mini" id="lbRenameCancel" type="button">取消</button>
    </div>
    <div class="fmt-row" id="lbFmtRow">
      <button class="fmt-btn" type="button" data-fmt="url">URL</button>
      <button class="fmt-btn" type="button" data-fmt="md">Markdown</button>
      <button class="fmt-btn" type="button" data-fmt="html">HTML</button>
      <button class="fmt-btn" type="button" data-fmt="bbcode">BBCode</button>
    </div>
    <div class="lb-ops">
      <button id="lbCopy" class="primary" type="button">复制链接</button>
      <button id="lbQr" type="button">二维码</button>
      <button id="lbOpen" type="button" style="display:none">打开</button>
      <button id="lbDownload" type="button">下载</button>
      <button id="lbRename" type="button">重命名</button>
    </div>
    <div class="lb-foot">
      <button id="lbDelete" class="danger" type="button">删除文件</button>
      <button id="lbClose" type="button">关闭</button>
    </div>
  </div>
</div>

<div id="qrModal">
  <div class="qr-box">
    <div class="qr-title">扫码访问文件直链</div>
    <img id="qrImg" alt="二维码">
    <div class="qr-url" id="qrUrl"></div>
    <div class="lb-ops">
      <button id="qrCopy" type="button">复制链接</button>
      <button id="qrClose" type="button">关闭</button>
    </div>
  </div>
</div>

<div id="nameModal">
  <div class="qr-box">
    <div class="qr-title">已存在同名文件</div>
    <div class="nm-name" id="nmName"></div>
    <input type="text" id="nmInput" spellcheck="false" maxlength="200" placeholder="输入新文件名（含扩展名）">
    <div class="lb-ops">
      <button id="nmRename" type="button">重命名上传</button>
      <button id="nmAuto" type="button">加编码继续</button>
      <button id="nmCancel" type="button">取消</button>
    </div>
  </div>
</div>

<div id="mainApp">
  <div class="shell" id="shell">
    <aside class="side">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M7 17h10a3.5 3.5 0 0 0 .4-7 5 5 0 0 0-9.6-1.2A3.5 3.5 0 0 0 7 17z"/></svg>
        </div>
        <div>
          <strong>云窝</strong>
          <small>私有网盘</small>
        </div>
      </div>
      <div class="side-scroll">
        <div class="side-label">文件</div>
        <div id="dirTabs">
          <button class="tab active" data-dir="all" type="button" aria-current="page">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><path d="M4 7.5h6l2 2H20v8.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18V7.5z"/><path d="M4 7.5V6.2A1.2 1.2 0 0 1 5.2 5H10l1.2 1.2"/></svg>
            全部文件
          </button>
          <button class="tab" data-dir="img" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.3"/><path d="m7 16 3-3 2.2 2.2L16 12l3 4"/></svg>
            图片
          </button>
          <button class="tab" data-dir="video" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M8 5v14M16 5v14M3.5 9.5H8M3.5 14.5H8M16 9.5h4.5M16 14.5h4.5"/></svg>
            视频
          </button>
          <button class="tab" data-dir="other" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><path d="M4 8.5 12 4.5l8 4v9L12 21.5 4 17.5v-9z"/><path d="M12 12.5 20 8.5M12 12.5 4 8.5M12 12.5V21"/></svg>
            其他
          </button>
        </div>
        <div class="side-label">本地</div>
        <button class="tab" id="recentTab" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.5l2.8 1.8"/></svg>
          本机最近
        </button>
      </div>
      <div class="side-foot">
        <div class="foot-row">
          <button class="iconbtn themebtn" id="themeBtn" type="button" title="切换主题" aria-label="切换主题">
            <svg class="ico-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v1.5M12 19.5V21M4.2 4.2l1.1 1.1M18.7 18.7l1.1 1.1M3 12h1.5M19.5 12H21M4.2 19.8l1.1-1.1M18.7 5.3l1.1-1.1"/></svg>
            <svg class="ico-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A7.5 7.5 0 1 1 9.5 4 6 6 0 0 0 20 14.5z"/></svg>
          </button>
          <button class="textbtn" id="logoutBtn" type="button">退出登录</button>
        </div>
        <a class="gh-side" href="https://github.com/yascitom/yunwo" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" width="13" height="13"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          开源仓库
        </a>
      </div>
    </aside>
    <div id="sideMask"></div>

    <div class="workspace">
      <div id="bannerSlot"></div>
      <header class="topbar">
        <button class="iconbtn" id="navBtn" type="button" aria-label="目录">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="crumb" id="crumb"><span class="crumb-now">全部文件</span></div>
        <div class="searchbox">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <input type="text" id="cloudSearch" placeholder="筛选当前目录" aria-label="筛选当前目录">
        </div>
        <div class="top-tools">
          <select class="sortsel" id="cloudSort" title="排序" aria-label="排序">
            <option value="time_desc">最新上传</option>
            <option value="time_asc">最早上传</option>
            <option value="size_desc">文件最大</option>
            <option value="size_asc">文件最小</option>
            <option value="name_asc">名称 A-Z</option>
            <option value="name_desc">名称 Z-A</option>
          </select>
          <div class="viewswitch" id="viewSwitch">
            <button class="viewbtn" data-view="grid" type="button" title="平铺" aria-label="平铺">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M1.5 1.5h5.5v5.5H1.5zm7.5 0H14.5v5.5H9zM1.5 9h5.5v5.5H1.5zM9 9h5.5v5.5H9z"/></svg>
            </button>
            <button class="viewbtn" data-view="fall" type="button" title="瀑布流" aria-label="瀑布流">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M1.5 1.5h3.6V14H1.5zm4.7 0h3.6V10H6.2zm4.7 0h3.6v8h-3.6z"/></svg>
            </button>
            <button class="viewbtn active" data-view="list" type="button" title="列表" aria-label="列表">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M1.5 2.5h13v2h-13zm0 4.5h13v2h-13zm0 4.5h13v2h-13z"/></svg>
            </button>
          </div>
          <button class="iconbtn" id="cloudRefresh" type="button" title="刷新" aria-label="刷新">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.2-5.5"/><path d="M20 4v5h-5"/></svg>
          </button>
          <div class="upload-group">
            <button class="primary" id="uploadBtn" type="button">上传</button>
            <button class="setbtn" id="setBtn" type="button" aria-label="上传设置" aria-expanded="false" title="上传设置">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div id="uploadMenu">
              <label class="switch"><input type="checkbox" id="keepName" checked> 保留原文件名</label>
              <p class="menu-hint">同名文件已存在时，上传会失败</p>
              <label class="switch"><input type="checkbox" id="webpToggle"> 图片压缩为 WebP</label>
              <label id="qualityRow">画质 <input type="range" id="quality" min="10" max="100" value="82"> <span id="qualityVal">82</span>%</label>
              <p class="menu-hint">单文件最大 <span id="maxMBVal">100</span> MB · 大文件分片，可断点续传</p>
            </div>
          </div>
        </div>
        <div id="batchBar">
          <span id="batchCount">已选 0 项</span>
          <button class="mini" id="batchAll" type="button">全选</button>
          <button class="mini" id="batchInvert" type="button">反选</button>
          <button class="mini" id="batchCopy" type="button">复制链接</button>
          <button class="mini danger" id="batchDelete" type="button">删除</button>
          <button class="mini" id="batchCancel" type="button">取消选择</button>
        </div>
      </header>

      <div class="stage">
        <div id="filePane" data-view="list">
          <div id="listHead">
            <button type="button" id="listCheck" aria-label="全选当前列表"></button>
            <span></span>
            <button type="button" data-sort="name">名称</button>
            <button type="button" data-sort="size">大小</button>
            <button type="button" data-sort="time">修改时间</button>
            <span></span>
          </div>
          <div class="grid batch" id="cloudList" data-view="list"></div>
        </div>
        <section id="historyCard">
          <div class="pane-head">
            <span>只保存在这台浏览器，不同步</span>
            <button class="mini danger" id="clearHist" type="button">清空</button>
          </div>
          <div class="grid" id="historyList"></div>
        </section>
      </div>

      <footer class="statusbar">
        <span id="cloudCount"></span>
        <span class="hintline" id="cloudHint" style="display:none"></span>
        <button class="textbtn" id="cloudMore" type="button" style="display:none">加载更多</button>
      </footer>
    </div>

    <aside id="inspector" aria-label="文件详情">
      <div class="ins-bar">
        <span>详细信息</span>
        <button class="iconbtn" id="insClose" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="ins-preview" id="insPreview"></div>
      <div class="ins-name" id="insName"></div>
      <dl class="ins-meta">
        <div><dt>大小</dt><dd id="insSize"></dd></div>
        <div><dt>类型</dt><dd id="insType"></dd></div>
        <div><dt>修改时间</dt><dd id="insTime"></dd></div>
        <div><dt>位置</dt><dd id="insWhere"></dd></div>
      </dl>
      <div class="ins-path" id="insPath"></div>
      <div class="fmt-row" id="insFmt">
        <button class="fmt-btn" type="button" data-fmt="url">URL</button>
        <button class="fmt-btn" type="button" data-fmt="md">Markdown</button>
        <button class="fmt-btn" type="button" data-fmt="html">HTML</button>
        <button class="fmt-btn" type="button" data-fmt="bbcode">BBCode</button>
      </div>
      <div class="ins-ops">
        <button class="primary" id="insOpen" type="button">打开</button>
        <button id="insCopy" type="button">复制链接</button>
        <button id="insDown" type="button">下载</button>
        <button id="insQr" type="button">二维码</button>
        <button id="insRename" type="button">重命名</button>
        <button class="danger" id="insDelete" type="button">删除</button>
      </div>
      <div class="rename-row ins-rename" id="insRenameRow" hidden>
        <input type="text" id="insRenameInput" spellcheck="false" maxlength="200" placeholder="新文件名（含扩展名）">
        <button class="mini" id="insRenameOk" type="button">确定</button>
      </div>
      <div class="ins-move">
        <span>移动到</span>
        <button type="button" data-dir="img">图片</button>
        <button type="button" data-dir="video">视频</button>
        <button type="button" data-dir="other">其他</button>
      </div>
    </aside>
  </div>
</div>

<div id="dropzone" hidden></div>
<input type="file" id="fileInput" multiple hidden>

<div id="upPanel">
  <div class="up-head" id="upHead">
    <div class="up-title"><span class="up-dot" id="upDot"></span><span id="upStatus">传输</span></div>
    <div class="up-actions">
      <button class="up-btn" id="upClear" type="button" style="display:none">清空</button>
      <button class="up-btn up-fold" id="upFoldBtn" type="button" title="折叠 / 展开" aria-label="折叠或展开">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
  <div class="up-agg"><i id="upAggBar"></i></div>
  <div class="up-body">
    <div class="up-clip">
      <div id="queue"></div>
    </div>
  </div>
</div>

<div id="dropOverlay">
  <div class="do-box">
    <div class="do-text">松开即上传</div>
    <div class="do-sub">文件会按类型放进图片、视频或其他</div>
  </div>
</div>

<div id="ctxMenu" role="menu">
  <button type="button" role="menuitem" data-act="open" data-single>打开</button>
  <button type="button" role="menuitem" data-act="copy" data-fmt="url">复制 URL</button>
  <button type="button" role="menuitem" data-act="copy" data-fmt="md">复制 Markdown</button>
  <button type="button" role="menuitem" data-act="copy" data-fmt="html">复制 HTML</button>
  <button type="button" role="menuitem" data-act="copy" data-fmt="bbcode">复制 BBCode</button>
  <button type="button" role="menuitem" data-act="qr" data-single>二维码</button>
  <button type="button" role="menuitem" data-act="down" data-single>下载</button>
  <button type="button" role="menuitem" data-act="rename" data-single>重命名</button>
  <div class="ctx-sep"></div>
  <div class="ctx-label">移动到</div>
  <button type="button" role="menuitem" data-act="move" data-dir="img">图片</button>
  <button type="button" role="menuitem" data-act="move" data-dir="video">视频</button>
  <button type="button" role="menuitem" data-act="move" data-dir="other">其他</button>
  <div class="ctx-sep"></div>
  <button type="button" role="menuitem" class="danger" data-act="del">删除</button>
</div>

<script src="vendor/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
